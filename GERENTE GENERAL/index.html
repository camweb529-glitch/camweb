<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#246b38">
    <title>CAMWEB | Gerente General</title>
    <link rel="stylesheet" href="estilos.css?v=20261109-sync">
</head>
<body>
    <header class="encabezado">
        <div class="zona-logo">
            <span id="textoLogoGeneral">LOGO</span>
            <img id="logoEmpresaGeneral" alt="Logo de la empresa" hidden>
        </div>
        <div class="titulo-empresa">
            <h1>GERENTE GENERAL</h1>
            <p>DEYBI LLANOS</p>
        </div>
        <div class="marca-camweb"><span id="nombreEmpresaGeneral">CAMWEB</span></div>
    </header>

    <main class="paneles-principales">
        <aside class="panel-lateral panel-izquierdo">
            <nav class="menu-gerente" aria-label="Menú principal">
                <div class="titulo-menu-gerente"><span aria-hidden="true">☰</span> MENÚ</div>
                <button type="button" class="opcion-menu-gerente" data-opcion-gerente="planos"><span class="icono-menu-gerente" aria-hidden="true">📐</span> PLANOS</button>
                <button type="button" class="opcion-menu-gerente" data-opcion-gerente="titulos"><span class="icono-menu-gerente" aria-hidden="true">🏷️</span> TÍTULOS</button>
                <button type="button" class="opcion-menu-gerente" data-opcion-gerente="color"><span class="icono-menu-gerente" aria-hidden="true">🎨</span> COLOR</button>
                <button type="button" class="opcion-menu-gerente" data-opcion-gerente="empresas"><span class="icono-menu-gerente" aria-hidden="true">🏢</span> EMPRESAS</button>
                <button type="button" class="opcion-menu-gerente" data-opcion-gerente="copia"><span class="icono-menu-gerente" aria-hidden="true">📋</span> COPIA</button>
                <button type="button" class="opcion-menu-gerente" data-opcion-gerente="credenciales"><span class="icono-menu-gerente" aria-hidden="true">🔐</span> USUARIO Y CONTRASEÑA</button>
            </nav>
        </aside>

        <section class="panel-central">
            <section class="plano-distribucion" id="vistaPlanos" aria-label="Plano de distribución de la tienda" hidden>
                <div class="rectangulo-plano encabezado-plano" data-zona-foto="encabezado">
                    <label class="selector-foto-plano" aria-label="Subir foto para el encabezado de Gerente General">
                        <span class="indicacion-foto-encabezado" id="indicacionFotoEncabezado">📷 SUBIR FOTO PARA EL ENCABEZADO</span>
                        <input type="file" id="archivoFotoEncabezado" accept="image/*">
                    </label>
                    <button type="button" class="boton-estado-foto" data-toggle-foto="encabezado" aria-pressed="true">DESACTIVAR</button>
                </div>
                <div class="cuerpo-plano">
                    <div class="rectangulo-plano zona-subida-plano" data-zona-foto="izquierda">
                        <label class="selector-foto-plano" aria-label="Subir foto para el lateral izquierdo">
                            <span class="indicacion-foto-zona">📷 SUBIR FOTO</span>
                            <input type="file" accept="image/*" data-archivo-zona="izquierda">
                        </label>
                        <button type="button" class="boton-estado-foto" data-toggle-foto="izquierda" aria-pressed="true">DESACTIVAR</button>
                    </div>
                    <div class="rectangulo-plano zona-subida-plano" data-zona-foto="centro">
                        <label class="selector-foto-plano" aria-label="Subir foto para el área central">
                            <span class="indicacion-foto-zona">📷 SUBIR FOTO</span>
                            <input type="file" accept="image/*" data-archivo-zona="centro">
                        </label>
                        <button type="button" class="boton-estado-foto" data-toggle-foto="centro" aria-pressed="true">DESACTIVAR</button>
                    </div>
                    <div class="rectangulo-plano zona-subida-plano" data-zona-foto="derecha">
                        <label class="selector-foto-plano" aria-label="Subir foto para el lateral derecho">
                            <span class="indicacion-foto-zona">📷 SUBIR FOTO</span>
                            <input type="file" accept="image/*" data-archivo-zona="derecha">
                        </label>
                        <button type="button" class="boton-estado-foto" data-toggle-foto="derecha" aria-pressed="true">DESACTIVAR</button>
                    </div>
                </div>
            </section>
            <div class="ajustes-encuadre-foto" id="ajustesEncuadreFoto" hidden>
                <p class="zona-encuadre-seleccionada" id="zonaEncuadreSeleccionada">AJUSTES DE FOTO</p>
                <div class="modos-encuadre-foto">
                    <button type="button" data-modo-encuadre="cover">LLENAR CUADRO</button>
                    <button type="button" data-modo-encuadre="contain">FOTO COMPLETA</button>
                </div>
                <div class="posiciones-encuadre-foto" aria-label="Elegir posición de la foto">
                    <button type="button" data-posicion-x="0" data-posicion-y="0" aria-label="Esquina superior izquierda" title="Arriba a la izquierda">↖</button>
                    <button type="button" data-posicion-x="50" data-posicion-y="0" aria-label="Centro arriba" title="Centro arriba">↑</button>
                    <button type="button" data-posicion-x="100" data-posicion-y="0" aria-label="Esquina superior derecha" title="Arriba a la derecha">↗</button>
                    <button type="button" data-posicion-x="0" data-posicion-y="50" aria-label="Centro izquierda" title="Centro izquierda">←</button>
                    <button type="button" data-posicion-x="50" data-posicion-y="50" aria-label="Centro" title="Centro">●</button>
                    <button type="button" data-posicion-x="100" data-posicion-y="50" aria-label="Centro derecha" title="Centro derecha">→</button>
                    <button type="button" data-posicion-x="0" data-posicion-y="100" aria-label="Esquina inferior izquierda" title="Abajo a la izquierda">↙</button>
                    <button type="button" data-posicion-x="50" data-posicion-y="100" aria-label="Centro abajo" title="Centro abajo">↓</button>
                    <button type="button" data-posicion-x="100" data-posicion-y="100" aria-label="Esquina inferior derecha" title="Abajo a la derecha">↘</button>
                </div>
                <label>Mover foto horizontalmente
                    <input type="range" id="posicionHorizontalFoto" min="0" max="100" value="50">
                </label>
                <label>Mover foto verticalmente
                    <input type="range" id="posicionVerticalFoto" min="0" max="100" value="50">
                </label>
                <label>Acercar o alejar
                    <input type="range" id="zoomFoto" min="50" max="250" step="5" value="100">
                </label>
                <p>Arrastra la foto o usa las posiciones para elegir qué parte mostrar. LLENAR CUADRO recorta los bordes; FOTO COMPLETA muestra toda la imagen.</p>
                <p>La foto se mezcla con el color principal seleccionado.</p>
            </div>
        </section>

        <aside class="panel-lateral panel-derecho" aria-hidden="true"></aside>
    </main>

    <footer class="pie-pagina">CAMWEB · Gerente General</footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../SUPABASE/supabase-client.js"></script>
<script src="../SUPABASE/supabase-data-bridge.js?v=20261109-sync"></script>
    <script src="script.js?v=20261109-sync"></script>
</body>
</html>
