
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAMWEB | Sistema de Gestión Lechera</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #dcebd5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .contenedor {
            background: white;
            width: 100%;
            max-width: 850px;
            padding: 40px 25px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.10);
        }

        h1 {
            color: #31572c;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .descripcion {
            color: #666;
            margin-bottom: 35px;
            font-size: 16px;
        }

        .modulos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 18px;
        }

        .modulo {
            display: block;
            text-decoration: none;
            background: #31572c;
            color: white;
            padding: 25px 15px;
            border-radius: 12px;
            transition: 0.2s;
        }

        .modulo:hover {
            background: #477a3e;
            transform: translateY(-4px);
        }

        .modulo h2 {
            font-size: 19px;
            margin-bottom: 10px;
        }

        .modulo p {
            font-size: 13px;
        }

        footer {
            margin-top: 35px;
            color: #777;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <main class="contenedor">

        <h1>CAMWEB</h1>

        <p class="descripcion">
            Sistema de gestión y control de compra de leche
        </p>

        <div class="modulos">

            <a href="./ADMINISTRADOR/index.html" class="modulo">
                <h2>ADMINISTRADOR</h2>
                <p>Gestión y control del sistema</p>
            </a>

            <a href="./GERENTE%20GENERAL/index.html" class="modulo">
                <h2>GERENTE GENERAL</h2>
                <p>Panel de gestión general</p>
            </a>

            <a href="./VEHICULOS/index.html" class="modulo">
                <h2>VEHÍCULOS</h2>
                <p>Gestión de vehículos y rutas</p>
            </a>

        </div>

        <footer>
            CAMWEB © 2026 - Sistema de gestión lechera
        </footer>

    </main>

</body>
</html>
